plugins { id 'com.android.application' }
android {
    namespace 'app.studyforge.mobile'
    compileSdk 36
    defaultConfig { applicationId 'com.studyforge.app'; minSdk 26; targetSdk 36; versionCode 17; versionName 'a1'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (System.getenv('STUDYFORGE_UPLOAD_STORE_FILE')) {
            playUpload {
                storeFile file(System.getenv('STUDYFORGE_UPLOAD_STORE_FILE'))
                storePassword System.getenv('STUDYFORGE_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('STUDYFORGE_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('STUDYFORGE_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; debuggable false; if (System.getenv('STUDYFORGE_UPLOAD_STORE_FILE')) signingConfig signingConfigs.playUpload } }
    testOptions { unitTests.returnDefaultValues = true }
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.path == ':app:bundleRelease' } && !System.getenv('STUDYFORGE_UPLOAD_STORE_FILE')) {
        throw new GradleException('Use scripts/build-play-bundle.ps1 or configure the private upload signing environment before building a Play bundle.')
    }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
